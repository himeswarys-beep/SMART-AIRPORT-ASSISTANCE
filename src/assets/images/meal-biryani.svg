<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBiryani" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="riceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgBiryani)" />
  
  <!-- Royal Copper Handi / Platter -->
  <ellipse cx="200" cy="160" rx="125" ry="90" fill="#78350f" stroke="#d97706" stroke-width="4" />
  
  <!-- Saffron Spiced Dum Rice Base -->
  <ellipse cx="200" cy="155" rx="110" ry="75" fill="url(#riceGrad)" />

  <!-- Fried Onions (Birista) & Mint -->
  <g opacity="0.8">
    <ellipse cx="170" cy="140" rx="8" ry="3" fill="#451a03" transform="rotate(25 170 140)" />
    <ellipse cx="230" cy="150" rx="9" ry="4" fill="#451a03" transform="rotate(-30 230 150)" />
    <ellipse cx="190" cy="170" rx="10" ry="3" fill="#451a03" transform="rotate(15 190 170)" />
    <ellipse cx="210" cy="130" rx="8" ry="3" fill="#451a03" transform="rotate(45 210 130)" />
    <circle cx="160" cy="160" r="5" fill="#15803d" />
    <circle cx="240" cy="135" r="5" fill="#15803d" />
    <circle cx="195" cy="145" r="6" fill="#16a34a" />
  </g>

  <!-- Tender Spiced Chicken Piece / Boiled Egg -->
  <ellipse cx="165" cy="150" rx="26" ry="18" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" transform="rotate(-15 165 150)" />
  <ellipse cx="235" cy="160" rx="20" ry="14" fill="#f8fafc" stroke="#fde047" stroke-width="2" transform="rotate(20 235 160)" />
  <circle cx="235" cy="160" r="7" fill="#facc15" />

  <!-- Cucumber Onion Raita Bowl -->
  <circle cx="330" cy="90" r="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3" />
  <circle cx="330" cy="90" r="6" fill="#22c55e" />
  <circle cx="323" cy="85" r="3" fill="#ef4444" />

  <!-- Non-Veg Red Stamp -->
  <rect x="20" y="20" width="32" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5" />
  <polygon points="36,26 44,42 28,42" fill="#ef4444" />
  <text x="60" y="42" fill="#fca5a5" font-family="sans-serif" font-size="13" font-weight="bold">ROYAL NON-VEG</text>
</svg>
