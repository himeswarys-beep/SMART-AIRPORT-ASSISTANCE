<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgJain)" />
  
  <!-- Satvik Meal Thali Plate -->
  <circle cx="200" cy="155" r="105" fill="#334155" stroke="#94a3b8" stroke-width="4" />
  
  <!-- Steamed Rice -->
  <circle cx="200" cy="155" r="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="200" cy="155" r="4" fill="#16a34a" />

  <!-- Jain Dal (No onion/garlic/root veg) -->
  <circle cx="140" cy="110" r="22" fill="#eab308" stroke="#fef08a" stroke-width="2" />
  <!-- Jain Paneer Makhani (Tomato-cashew base) -->
  <circle cx="200" cy="90" r="22" fill="#ea580c" stroke="#fed7aa" stroke-width="2" />
  <rect x="195" y="85" width="10" height="10" fill="#ffffff" rx="2" />
  <!-- Moong Sprout Salad -->
  <circle cx="260" cy="110" r="22" fill="#84cc16" stroke="#d9f99d" stroke-width="2" />
  <!-- Fresh Phulka Roti -->
  <circle cx="150" cy="195" r="24" fill="#fed7aa" stroke="#fcd34d" stroke-width="2" />
  <circle cx="145" cy="190" r="2" fill="#78350f" />
  <!-- Gulab Jamun -->
  <circle cx="245" cy="195" r="20" fill="#78350f" stroke="#b45309" stroke-width="2" />

  <!-- Jain Vegetarian Badge -->
  <rect x="20" y="20" width="32" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#22c55e" stroke-width="1.5" />
  <circle cx="36" cy="36" r="8" fill="#22c55e" />
  <text x="60" y="42" fill="#86efac" font-family="sans-serif" font-size="13" font-weight="bold">SATVIK JAIN SPECIAL</text>
</svg>
