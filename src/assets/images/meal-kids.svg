<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgKids)" />
  
  <!-- Fun Kids Flight Bento Box -->
  <rect x="70" y="80" width="260" height="170" rx="18" fill="#1e3a8a" stroke="#fbbf24" stroke-width="3" />
  
  <!-- Mini Slider Burger -->
  <ellipse cx="140" cy="140" rx="35" ry="18" fill="#d97706" />
  <rect x="108" y="142" width="64" height="6" fill="#16a34a" rx="2" />
  <rect x="110" y="148" width="60" height="8" fill="#dc2626" rx="2" />
  <rect x="106" y="156" width="68" height="6" fill="#78350f" rx="3" />
  <ellipse cx="140" cy="164" rx="34" ry="12" fill="#d97706" />
  
  <!-- Golden Oven-Baked Smiley Fries -->
  <g fill="#facc15" stroke="#ca8a04" stroke-width="1.5">
    <rect x="220" y="110" width="8" height="35" rx="3" transform="rotate(-15 220 110)" />
    <rect x="235" y="105" width="8" height="40" rx="3" />
    <rect x="250" y="112" width="8" height="34" rx="3" transform="rotate(10 250 112)" />
    <rect x="265" y="118" width="8" height="30" rx="3" transform="rotate(25 265 118)" />
  </g>
  
  <!-- Apple Fruit Slices & Choco Cookie -->
  <circle cx="215" cy="195" r="18" fill="#78350f" stroke="#451a03" stroke-width="2" />
  <circle cx="210" cy="190" r="3" fill="#1e1b4b" />
  <circle cx="220" cy="198" r="3" fill="#1e1b4b" />
  
  <path d="M 255,180 Q 275,180 270,210 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
  <path d="M 270,185 Q 290,190 280,215 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />

  <!-- Kids Aviator Smile Badge -->
  <rect x="20" y="20" width="32" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="36" cy="36" r="8" fill="#f59e0b" />
  <text x="60" y="42" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="bold">JUNIOR AVIATOR MEAL</text>
</svg>
