<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="thaliGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="85%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgSouth)" />
  <!-- Traditional Steel Thali Platter -->
  <circle cx="200" cy="150" r="110" fill="url(#thaliGrad)" stroke="#64748b" stroke-width="4" />
  <circle cx="200" cy="150" r="98" fill="#14532d" fill-opacity="0.3" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Steamed Basmati / Pongal Bowl -->
  <circle cx="200" cy="150" r="35" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="200" cy="150" r="6" fill="#eab308" />

  <!-- Katori Bowls around the rim -->
  <!-- Sambar -->
  <circle cx="140" cy="100" r="22" fill="#ea580c" stroke="#fed7aa" stroke-width="2" />
  <circle cx="140" cy="100" r="15" fill="#c2410c" />
  
  <!-- Coconut Chutney -->
  <circle cx="200" cy="80" r="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="200" cy="80" r="6" fill="#15803d" />

  <!-- Tomato Chutney -->
  <circle cx="260" cy="100" r="22" fill="#dc2626" stroke="#fca5a5" stroke-width="2" />
  
  <!-- Curd / Raita -->
  <circle cx="270" cy="165" r="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Sweet Payasam -->
  <circle cx="130" cy="165" r="22" fill="#fef08a" stroke="#fde047" stroke-width="2" />

  <!-- Crispy Vada / Appalam -->
  <ellipse cx="170" cy="205" rx="20" ry="14" fill="#d97706" stroke="#b45309" stroke-width="2" />
  <circle cx="170" cy="205" r="5" fill="#78350f" />
  
  <polygon points="215,190 245,210 210,225" fill="#fef3c7" stroke="#fde68a" stroke-width="2" />

  <!-- Pure Veg Green Stamp -->
  <rect x="20" y="20" width="32" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#22c55e" stroke-width="1.5" />
  <circle cx="36" cy="36" r="8" fill="#22c55e" />
  <text x="60" y="42" fill="#86efac" font-family="sans-serif" font-size="13" font-weight="bold">100% PURE VEG</text>
</svg>
