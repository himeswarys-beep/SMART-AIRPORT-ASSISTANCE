<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPaneer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgPaneer)" />
  
  <!-- Matte Black Platter -->
  <rect x="70" y="80" width="260" height="170" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3" />
  
  <!-- Grilled Paneer Tikka Skewer -->
  <line x1="85" y1="145" x2="245" y2="145" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  
  <!-- Charred Paneer Cubes & Bell Peppers -->
  <!-- Cube 1 -->
  <rect x="100" y="125" width="30" height="40" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
  <line x1="105" y1="135" x2="125" y2="135" stroke="#7c2d12" stroke-width="2" />
  <line x1="105" y1="150" x2="125" y2="150" stroke="#7c2d12" stroke-width="2" />
  <!-- Green Pepper -->
  <polygon points="135,130 148,133 145,158 135,160" fill="#16a34a" stroke="#14532d" stroke-width="1.5" />
  <!-- Cube 2 -->
  <rect x="152" y="125" width="30" height="40" rx="4" fill="#ffedd5" stroke="#f97316" stroke-width="2" />
  <line x1="157" y1="135" x2="177" y2="135" stroke="#7c2d12" stroke-width="2" />
  <line x1="157" y1="150" x2="177" y2="150" stroke="#7c2d12" stroke-width="2" />
  <!-- Red Onion -->
  <polygon points="186,132 198,130 196,160 186,158" fill="#a21caf" stroke="#701a75" stroke-width="1.5" />
  <!-- Cube 3 -->
  <rect x="202" y="125" width="30" height="40" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
  <line x1="207" y1="135" x2="227" y2="135" stroke="#7c2d12" stroke-width="2" />

  <!-- Mint Mayo Dip & Lemon Wedge -->
  <circle cx="280" cy="125" r="22" fill="#86efac" stroke="#16a34a" stroke-width="2" />
  <circle cx="280" cy="125" r="8" fill="#15803d" opacity="0.4" />
  
  <path d="M 265,185 A 25 25 0 0 0 305,185 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2" />

  <!-- Pure Veg Gourmet Badge -->
  <rect x="20" y="20" width="32" height="32" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#22c55e" stroke-width="1.5" />
  <circle cx="36" cy="36" r="8" fill="#22c55e" />
  <text x="60" y="42" fill="#86efac" font-family="sans-serif" font-size="13" font-weight="bold">GOURMET TANDOORI VEG</text>
</svg>
